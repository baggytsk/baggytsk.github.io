<!-- 본문 폰트 SUIT (2026-11-04, Pretendard에서 변경) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css" />

<!-- 코드 폰트: 영문 JetBrains Mono, 한글 주석은 D2Coding -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding@1.3.2/d2coding.css" />

<!-- 다크 모드: 저장된 선택 > 기기 설정. head에서 바로 실행해 깜빡임 방지 -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");

    document.addEventListener("DOMContentLoaded", function () {
      var nav = document.querySelector(".greedy-nav");
      if (!nav) return;
      var btn = document.createElement("button");
      btn.className = "theme-toggle";
      btn.type = "button";
      var render = function () {
        var isDark = document.documentElement.getAttribute("data-theme") === "dark";
        btn.textContent = isDark ? "☀️" : "🌙";
        btn.setAttribute("aria-label", isDark ? "라이트 모드로" : "다크 모드로");
      };
      btn.addEventListener("click", function () {
        var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        render();
      });
      render();
      var search = nav.querySelector(".search__toggle");
      nav.insertBefore(btn, search || null);
    });
  })();
</script>

<!-- end custom head snippets -->
