# Site settings
locale: "ko-KR"
title: "baggy"
subtitle: "인생을 즐기되 제대로"
email: "jinoj0423@gmail.com"
description: >-
  TIL을 차근차근 적어가보겠습니다.
url: "https://baggytsk.github.io"
repository: "baggytsk/baggytsk.github.io"
github_username: baggytsk
minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes@4.28.0

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Seoul

include:
  - _pages

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "남 진"
  avatar : "/assets/images/baggy-photo.png"
  bio    : "하나씩 차근차근 기록해가는 내 메모리"
  location : "Seoul, Korea"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://baggytsk.github.io"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/baggytsk"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/baggy_tsk"

footer:
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://baggytsk.github.io"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/baggytsk"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/baggy_tsk"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true
      sidebar:
        nav: "categories"
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
